name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install ruff pytest pytest-cov trino
          pip install -e .

      - name: Run Ruff Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --output-format=github

      - name: Check Code Formatting (Ruff)
        run: |
          ruff format --check .

      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=src --cov-report=xml -v

      - name: Upload Coverage Artifact to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'  # Upload coverage report once per pipeline run
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional if repository is public
