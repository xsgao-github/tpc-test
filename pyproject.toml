[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tpctest"
version = "0.1.0"
description = "A test project for Trino Python client"
readme = "README.md"
dependencies = [
    "trino>=0.340.0",
]

[dependency-group]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
